# Serves the admin app (built by the frontend repo into ./web/current) and
# passes /api/ to the API with the prefix removed — the same shape as the Vite
# dev proxy, so the refresh cookie stays first-party.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /srv/web/current;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Our Web Bot Auth public key directory (shops fetch it to check our signatures).
    location = /.well-known/http-message-signatures-directory {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # Caddy in front already replaced X-Forwarded-For with the client address.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        try_files $uri /index.html;
    }
}
