# Sribees Price Intel — PRODUCTION stack on the Contabo box (/opt/sribees-price-intel-prod),
# the same shape as Sribees Finance.
#
# The box's public edge is sribees-express-dev's Caddy (it owns 80/443). This
# stack publishes no host port: `web` joins the shared `sribees_default` network
# under the alias sribees-price-intel-prod-web, and a Caddy block proxies to it.
# `web` serves the admin app and passes /api/ to `api`.
#
# Not on the server that serves customers (api.sribees.com), so a shop blocking our
# reader can never block the shop. Online is reached over HTTPS at api.sribees.com.
#
# The `worker` runs the daily job at 05:00 Colombo time. It needs the internet
# (competitor sites and Online), so it also joins sribees_default.
#
# INTEL_IMAGE is set by the deploy (an image loaded on the box, tagged by commit).

name: sribees-price-intel-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intel
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ${INTEL_IMAGE:?set INTEL_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Accepting a suggestion calls Online's admin API.
    networks: [internal, edge]

  worker:
    image: ${INTEL_IMAGE:?set INTEL_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "scheduler"]
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv/web:ro
    networks:
      internal: {}
      edge:
        aliases: [sribees-price-intel-prod-web]

  # Nightly database dump, kept 14 days, in the backups volume (copy it off the box).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/intel-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          pg_dump -h postgres -U intel -d intel | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f"
          find /backups -name 'intel-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    networks: [internal]

volumes:
  pgdata:
  backups:

networks:
  internal: {}
  edge:
    name: sribees_default
    external: true
