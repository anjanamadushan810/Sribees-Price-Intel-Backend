/* Stock badge for out of stock items - positioned on image */
.product-thumb .image {
  position: relative;
}

.stock-badge.out-of-stock {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: rgba(145, 49, 20, 0.9);
  color: #ffffff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  z-index: 10;
  text-transform: uppercase;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}
/* Save badge for special items - positioned on image (top right) */
.stock-badge.save-badge {
  position: absolute;
  top: 0px;
  right: 10px;
  background: linear-gradient(145deg, #5D8BF4, #2D31FA);
  color: #ffffff;
  /* Reduced bottom padding since the extra space for the fake triangle is no longer needed */
  padding: 4px 5px 20px 5px;
  border-radius: 10px 10px 0 0; /* Rounds the top, leaves the bottom points sharp */
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.4px;
  z-index: 10;
  text-transform: uppercase;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 64px;
  
  /* Creates the true transparent cut-out at the bottom */
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 12px), 0 100%);
  
  /* Use drop-shadow instead of box-shadow so it follows the clip-path shape */
  filter: drop-shadow(0 6px 12px rgba(24, 104, 242, 0.35));
}

.stock-badge.save-badge .save-amount {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.1;
}
/* In stock info - positioned in caption area */
.stock-info.in-stock {
  color: #28a745;
  font-weight: 500;
  font-size: 14px;
  margin: 6px 0;
  display: inline-block;
}
</style>

<script>
(function () {
  function parsePrice(value) {
    if (!value) return NaN;
    var cleaned = String(value).replace(/[^0-9.,-]/g, "");
    if (!cleaned) return NaN;
    if (cleaned.indexOf(",") !== -1 && cleaned.indexOf(".") === -1) {
      cleaned = cleaned.replace(/,/g, "");
    } else {
      cleaned = cleaned.replace(/,/g, "");
    }
    var num = parseFloat(cleaned);
    return isNaN(num) ? NaN : num;
  }

  var badges = document.querySelectorAll(".stock-badge.save-badge");
  badges.forEach(function (badge) {
    var price = parsePrice(badge.getAttribute("data-price"));
    var special = parsePrice(badge.getAttribute("data-special"));
    if (!isNaN(price) && !isNaN(special) && price > special) {
      var saved = Math.round(price - special);
      var amountEl = badge.querySelector(".save-amount");
      if (amountEl) amountEl.textContent = "Rs. " + saved;
    }
  });
})();
</script>
