# Lint and the full test suite against a real PostgreSQL: the rules that matter (one
# live match, one pending suggestion, append-only history) live in constraints and
# triggers, so there is no meaningful test run without one.
# Runs on pull requests, by hand, and as the gate in front of every deploy.
# No push trigger: Actions minutes are spent only when someone asks.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Tests
        env:
          PRICE_INTEL_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q
