# Sribees Price Intel API + worker — PRODUCTION deploy to the Contabo box
# (https://price.sribees.com).
#
# Manual only (workflow_dispatch): every run spends Actions minutes.
# CI gate -> send the committed tree to the box over SSH and build the image THERE
# (it carries Chromium, ~1.8 GB: building on the box beats shipping it) -> migrate ->
# roll out -> smoke test through the public hostname.
#
# Repository secrets:
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS — the Contabo box
#   PROD_ENV_FILE (optional) — if not provided, existing /opt/sribees-price-intel-prod/.env is used
name: Deploy Production (Contabo)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build on the box & deploy (Production)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_PATH: /opt/sribees-price-intel-prod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          # A pinned host key; never StrictHostKeyChecking=no.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 20"
          } > ~/.ssh/config
          ssh target "echo connected as \$(id -un)"

      - name: Prepare the remote directory
        # /opt is root-owned and the deploy account has no sudo; it is in the
        # docker group, so a throwaway container creates the tree once.
        run: |
          ssh target "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          if install -d -m 0750 "$DEPLOY_PATH" 2>/dev/null; then exit 0; fi
          docker run --rm -v /opt:/mnt alpine:3.20 sh -c "
            mkdir -p '/mnt/$(basename "$DEPLOY_PATH")' &&
            chown $(id -u):$(id -g) '/mnt/$(basename "$DEPLOY_PATH")' &&
            chmod 0750 '/mnt/$(basename "$DEPLOY_PATH")'"
          REMOTE

      - name: Build the image on the box
        run: |
          IMAGE="sribees-price-intel:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          git archive --format=tar HEAD | ssh target "docker build -q -t '$IMAGE' - >/dev/null && echo built $IMAGE"

      - name: Ship the bundle
        run: |
          git archive --format=tar HEAD:deploy | ssh target "tar -C '$DEPLOY_PATH' -xf - && chmod 0750 '$DEPLOY_PATH/deploy-prod.sh'"

      - name: Install the environment file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -n "$PROD_ENV_FILE" ]; then
            printf '%s\n' "$PROD_ENV_FILE" | ssh target "umask 077 && cat > '$DEPLOY_PATH/.env'"
            echo "Installed .env from PROD_ENV_FILE secret"
          else
            ssh target "[ -f '$DEPLOY_PATH/.env' ] || { echo '::error::.env not found at $DEPLOY_PATH/.env and secret PROD_ENV_FILE is empty'; exit 1; }"
            echo "Using existing .env on the server at $DEPLOY_PATH/.env"
          fi

      - name: Roll out
        run: ssh target "'$DEPLOY_PATH/deploy-prod.sh' '$IMAGE'"

      - name: Smoke test through the edge
        run: |
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://price.sribees.com/api/health || true)"
            [ "$code" = 200 ] && { echo "https://price.sribees.com/api/health answered 200"; exit 0; }
            sleep 6
          done
          echo "::error::https://price.sribees.com/api/health answered ${code:-nothing}"
          exit 1

